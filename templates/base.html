<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusEvent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ url_for('main.index') }}">CampusEvent</a>
    <nav class="nav">
      <a href="{{ url_for('main.index') }}">活动列表</a>
      <a href="{{ url_for('main.my_registrations') }}">我的报名</a>
      <a href="{{ url_for('main.messages') }}">消息{% if unread %}<span class="badge">{{ unread }}</span>{% endif %}</a>
      <a href="{{ url_for('main.admin_index') }}">管理端</a>
    </nav>
    <form class="student-switch" method="post" action="{{ url_for('main.switch_student') }}">
      <select name="student_id" aria-label="切换演示学生" onchange="this.form.submit()">
        {% for sid, name in demo_students %}
        <option value="{{ sid }}" {% if sid == current_student %}selected{% endif %}>{{ name }}（{{ sid }}）</option>
        {% endfor %}
      </select>
      <input type="hidden" name="next" value="{{ request.path }}">
    </form>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="wrap foot">CampusEvent · 校园活动报名与管理系统 · 实验二 baseline-v1</footer>
</body>
</html>
